name: Release
# A tag v* builds the APK signed with the release key and attaches it to the GitHub release (created if missing).
# Run by hand (workflow_dispatch) it only builds and keeps the APK as a downloadable artifact, for testing.
# The key comes from the secrets MINERVA_KEYSTORE_B64 and MINERVA_KEYSTORE_PASSWORD; secrets are never given to
# pull requests from forks.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core tests
        shell: bash
        run: bash test.sh
      - name: Android SDK (platform 36, build-tools 36)
        shell: pwsh
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          'y','y','y','y','y' | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0" | Out-Null
      - name: Build signed APK
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.MINERVA_KEYSTORE_B64 }}
          MINERVA_KEYSTORE_PASSWORD: ${{ secrets.MINERVA_KEYSTORE_PASSWORD }}
        run: |
          $env:MINERVA_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.p12'
          [IO.File]::WriteAllBytes($env:MINERVA_KEYSTORE, [Convert]::FromBase64String($env:KEYSTORE_B64))
          try { ./build-apk.ps1 -Project app -Name Minerva -Release } finally { Remove-Item $env:MINERVA_KEYSTORE -ErrorAction SilentlyContinue }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Copy-Item app/build/Minerva.apk "Minerva-$version.apk"
          "APK=Minerva-$version.apk" | Out-File $env:GITHUB_ENV -Append
          (Get-FileHash "Minerva-$version.apk" -Algorithm SHA256).Hash
      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Minerva ${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
      - name: Keep as artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: minerva-apk
          path: ${{ env.APK }}
          retention-days: 7
